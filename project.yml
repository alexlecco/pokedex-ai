name: Pokedex
options:
  bundleIdPrefix: com.alexlecco
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""

packages: {}

targets:
  Pokedex:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pokedex
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Pokedex/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexlecco.pokedex
        INFOPLIST_FILE: Pokedex/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    info:
      path: Pokedex/Resources/Info.plist
      properties:
        NSCameraUsageDescription: "Pokedex uses the camera to scan and identify Pokemon"
        NSPhotoLibraryUsageDescription: "Pokedex accesses photos to identify Pokemon"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Pokédex
        CFBundleName: Pokedex

  PokedexTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PokedexTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexlecco.pokedex.tests
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - target: Pokedex
